services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirikshan
      POSTGRES_PASSWORD: nirikshan
      POSTGRES_DB: nirikshan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirikshan -d nirikshan"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NIRIKSHAN_DATABASE_URL: postgresql://nirikshan:nirikshan@postgres:5432/nirikshan
      NIRIKSHAN_JWT_SECRET: ${NIRIKSHAN_JWT_SECRET:-dev-only-secret-change-me}
      NIRIKSHAN_SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
